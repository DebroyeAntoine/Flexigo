      - label: "Menu Télévision"
        type: container
        grid_width: 4
        grid_height: 4
        width: 2
        height: 1
        position:
          x: 2
          y: 5
        children:
          - label: "Allumer la TV2"
            width: 1
            height: 1
            position:
              x: 0
              y: 0
            type: http
            method: POST
            url: "http://example.com/api"
            headers:
              Authorization: "Bearer ${DUMMY_TOKEN}"
            body: '{"entity_id": "tv.living_room"}'
          - label: "Allumer la TV"
            width: 1
            height: 1
            position:
              x: 3
              y: 2
            type: http
            method: POST
            url: "http://example.com/api"
            headers:
              Authorization: "Bearer ${DUMMY_TOKEN}"
            body: '{"entity_id": "tv.living_room"}'
