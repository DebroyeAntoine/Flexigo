voice: "Amélie"
ir_backend: "serial"
ir_serial_port: "/dev/tty.usbmodemHIDGD1"  # Linux/macOS: /dev/ttyUSB0, Windows: COM3
ir_baud_rate: 9600
blocks:
  - label: "Menu Principal"
    type: container
    timer: 1000
    background:
      r: 127
      g: 0
      b: 0
      a: 255
    grid_width: 4
    grid_height: 8
    children:
      # Clavier avec couleur personnalisée verte
      - label: "Clavier"
        voice: "Sandy (fr-FR)"
        type: keyboard
        width: 1
        height: 1
        position:
          x: 0
          y: 0
        color:
          r: 0
          g: 200
          b: 0
          a: 255
        highlight_color:
          r: 100
          g: 0
          b: 100
          a: 255
        layout:
          - "EANRCV"
          - "JILPHW"
          - "SUDGK"
          - "TMBZ"
          - "OFX"
          - "QY"
      - label: "🦊 Firefox Web"
        type: browser
        browser_url: "https://developer.mozilla.org"
        # Exemple pour Firefox sur Linux
        browser_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

        width: 2
        height: 2
        position:
          x: 1
          y: 1
        color:
          r: 255
          g: 149
          b: 0
          a: 255
      - label: "Lire Bonjour"
        type: tts
        group_membership: 1
        text: "Bonjour, comment vas-tu ?"
        width: 1
        height: 2
        position:
          x: 1
          y: 1
      - label: "📺 TV Power"
        type: ir
        ir_device: "tv"
        ir_command: "power"
        ir_protocol: "SAMSUNG"
        ir_code: "0x0707"  # Code hex pour Samsung TV
        width: 1
        height: 1
        position:
          x: 3
          y: 0
        color:
          r: 255
          g: 100
          b: 0
          a: 255

