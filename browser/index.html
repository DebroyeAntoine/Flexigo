<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Navigateur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabs"></div>

  <header>
    <button id="back">◀</button>

  </header>

  <script src="renderer.js"></script>
</body>
</html>
