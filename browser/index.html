<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <div id="tabs"></div>
    
    <header>
      <button id="back">◀</button>
      <button id="forward">▶</button>
      <button id="reload">⟳</button>
      <button id="newTab">＋</button>
      <button id="toggleKbd">⌨️</button>
      <input id="url" type="text" placeholder="Entrez une URL...">
      <button id="quit">EXIT</button>
    </header>

    <!-- Cette zone vide est l'endroit où le site web va s'afficher -->
    <div id="view-placeholder"></div>

    <div id="keyboard-container" class="hidden">
      <div class="keyboard-row">
          <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key">0</button>
      </div>
      <div class="keyboard-row">
          <button class="key">a</button><button class="key">z</button><button class="key">e</button><button class="key">r</button><button class="key">t</button><button class="key">y</button><button class="key">u</button><button class="key">i</button><button class="key">o</button><button class="key">p</button>
      </div>
      <div class="keyboard-row">
          <button class="key">q</button><button class="key">s</button><button class="key">d</button><button class="key">f</button><button class="key">g</button><button class="key">h</button><button class="key">j</button><button class="key">k</button><button class="key">l</button><button class="key">m</button>
      </div>
      <div class="keyboard-row">
          <button class="key">w</button><button class="key">x</button><button class="key">c</button><button class="key">v</button><button class="key">b</button><button class="key">n</button><button class="key">,</button><button class="key">.</button><button class="key">/</button><button class="key">@</button>
      </div>
      <div class="keyboard-row">
          <button class="key wide" data-key="Backspace">Effacer</button>
          <button class="key extra-wide" data-key=" ">Espace</button>
          <button class="key wide" data-key="Enter">Entrer</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
